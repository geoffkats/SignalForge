[project]
name = "signalforge-ml"
version = "0.1.0"
description = "ML and data pipeline for SignalForge"
requires-python = ">=3.10"
dependencies = [
    "cmapPy>=4.0,<5.0",
    "joblib>=1.4,<2.0",
    "numpy>=2.2,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=19.0,<20.0",
    "pyyaml>=6.0,<7.0",
    "rdkit>=2024.9.6",
    "scikit-learn>=1.7,<1.8",
    "torch>=2.6,<3.0",
    "typer>=0.15,<1.0"
]

[project.scripts]
signalforge-ml = "signalforge_ml.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["signalforge_ml*"]

[project.optional-dependencies]
inference = [
    "joblib>=1.4,<2.0",
    "numpy>=2.2,<3.0",
    "pandas>=2.2,<3.0",
    "rdkit>=2024.9.6",
    "scikit-learn>=1.7,<1.8",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=6.0,<7.0",
]